name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          # The floor of every constraint in composer.json, so a consumer on the
          # oldest supported Laravel is covered rather than assumed.
          - php: '8.2'
            dependencies: lowest

    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: vendor/bin/phpunit

  pint:
    runs-on: ubuntu-latest
    name: pint

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/pint --test
